# Mantém o projeto Supabase do iFix Lab (plano gratuito) ativo.
# O Supabase pausa projetos gratuitos depois de ~7 dias sem uso; este
# "ping" diário consulta o banco e evita a pausa.
name: Manter Supabase ativo

on:
  schedule:
    - cron: '17 11 * * *' # todo dia, 08:17 no horário de Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar o banco
        run: |
          curl -fsS -X POST "https://svdsvmylwzfofxydwbmp.supabase.co/rest/v1/rpc/keepalive" \
            -H "apikey: sb_publishable_x7kcURZCS-Be8Uj-E5S8vQ_jX9XyMd4" \
            -H "Content-Type: application/json" -d '{}'
      # O GitHub desliga agendamentos de repositórios sem nenhum commit há 60 dias.
      # Um commit vazio no dia 1º de cada mês evita isso.
      - name: Commit mensal para manter o agendamento ligado
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" repo
            cd repo
            git config user.name "ifix-lab-bot"
            git config user.email "ifix-lab-bot@users.noreply.github.com"
            git commit --allow-empty -m "Manutenção mensal: mantém o ping do Supabase ativo"
            git push
          fi
