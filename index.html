    <script>
      // Reverte o redirecionamento feito pelo public/404.html, restaurando a
      // URL original (ex: /ifix-lab/ordens-servico) antes do React montar.
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
          window.history.replaceState(
            null,
            '',
            l.pathname.slice(0, -1) + decoded.shift() + (decoded.length ? '?' + decoded.join('&') : '') + l.hash
          )
        }
      })(window.location)
    </script>
